<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle with subtle outline -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#goldPurple)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5" />
  <g transform="translate(15, 15)">
    <!-- Minimalist 'R' Monogram + Spark -->
    <!-- Vertical bar of R as a styled pill -->
    <rect x="18" y="15" width="8" height="40" rx="4" fill="url(#goldPurple)" />
    <!-- The R Loop and diagonal leg as one continuous fluid stroke -->
    <path d="M18 19 C18 19, 32 10, 42 19 C52 28, 42 39, 26 39" fill="none" stroke="url(#goldPurple)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M28 35 L48 55" fill="none" stroke="url(#goldPurple)" stroke-width="8" stroke-linecap="round" />
    <!-- Optimization Spark (the asterisk / star at the top right) -->
    <path d="M48 20 L52 12 L56 20 L64 24 L56 28 L52 36 L48 28 L40 24 Z" fill="#eab308" filter="url(#glow)" />
  </g>
</svg>
